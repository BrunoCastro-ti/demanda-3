<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TravelPlus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
 
<div id="toast"></div>
<div id="app"></div>
 
<script>
 
const ICONS = {
  plane:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M10.5 21l1.5-6.5L3 12l1-2 9-1 3.5-6.5a1.2 1.2 0 0 1 2.1 1.1L16 12l6 1-1 2-8.5.5L11 21h-.5z"/></svg>',
  mountain:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 18l6-9 4 5 2-3 6 7H3z"/></svg>'
};

function phImg(extra=''){ return `<div class="ph-img ${extra}">${ICONS.mountain}</div>`; }
function realImg(url, alt, extra=''){
  return `<div class="ph-img ${extra}"><img src="${url}" alt="${alt}" loading="lazy" onerror="this.parentElement.innerHTML='${ICONS.mountain.replace(/'/g,"\\'")}'"></div>`;
}
const HERO_IMG = './onibus.jpg';
 
const DESTINOS = [
  {id:'pouso alegre', nome:'Pouso alegre', local:'Rio Grande do Sul, Brasil', preco:1299, rating:4.7,
   img:'./pouso-alegre.jpg',
   desc:'Cidade serrana charmosa, conhecida pela arquitetura de inspiração europeia e o clima frio.',
   inclui:['Passagem aérea','Hospedagem','Café da manhã']},
  {id:'noronha', nome:'Fernando de Noronha', local:'Pernambuco, Brasil', preco:2499, rating:4.8,
   img:'./fernando-de-noronha.jpg',
   desc:'Paraíso tropical de águas cristalinas, vida marinha exuberante e paisagens únicas.',
   inclui:['Passagem aérea','Hospedagem','Café da manhã','Passeios (opcionais)']},
  {id:'buzios', nome:'Búzios', local:'Rio de Janeiro, Brasil', preco:1899, rating:4.6,
   img:'./buzios.jpg',
   desc:'Península com mais de vinte praias, clima boêmio e boa gastronomia à beira-mar.',
   inclui:['Passagem aérea','Hospedagem','Café da manhã']},
  {id:'rio', nome:'Rio de Janeiro', local:'Rio de Janeiro, Brasil', preco:1499, rating:4.5,
   img:'./rio.jpg',
   desc:'A Cidade Maravilhosa combina praias urbanas, morros icônicos e vida cultural intensa.',
   inclui:['Passagem aérea','Hospedagem','Café da manhã']},
  {id:'maceio', nome:'Maceio', local:'Alagoas, Brasil', preco:2799, rating:4.9,
   img:'./maceio.jpg',
   desc:'Areias brancas, mar turquesa e resorts completos perto de ruínas maias.',
   inclui:['Passagem aérea','Hospedagem','Café da manhã']},
  {id:'guarapari', nome:'Guarapari', local:'Espirito Santo, Brasil', preco:1399, rating:4.7,
   img:'./guarapari.jpg',
   desc:'A Cidade Luz encanta com museus, arquitetura histórica e cafés de esquina.',
   inclui:['Passagem aérea','Hospedagem','Café da manhã']}
];
 
 
const state = {
  route:'home',
  destId:null,
  filtro:'Todos',
  userName:null,
  bookings:[],
  avaliacoes:[...AVALIACOES]
};
 
function fmt(n){ return 'R$ ' + n.toLocaleString('pt-BR'); }
function findDest(id){ return DESTINOS.find(d=>d.id===id); }
 
function navigate(route, params={}){
  state.route = route;
  Object.assign(state, params);
  window.scrollTo(0,0);
  render();
}
 
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window.__t);
  window.__t = setTimeout(()=>t.classList.remove('show'), 2800);
}
 
 
function header(){
  const links = [['home','Início'],['destinos','Destinos'],['avaliacoes','Avaliações'],['sobre','Sobre'],['contato','Contato']];
  const navLinks = links.map(([r,l])=>`<a href="#" data-nav="${r}" class="${state.route===r?'active':''}">${l}</a>`).join('');
  return `<header><div class="container nav-row">
    <a href="#" class="logo" data-nav="home">${ICONS.plane} TravelPlus</a>
    <nav class="nav-links">${navLinks}</nav>
    <a href="#" class="btn btn-primary" data-nav="destinos">Reservar Agora</a>
  </div></header>`;
}
function footer(){
  return `<footer>© 2026 TravelPlus. Todos os direitos reservados.</footer>`;
}
function destCard(d){
  return `<div class="card" data-nav="detalhe" data-id="${d.id}">
    ${realImg(d.img, d.nome)}
    <div class="body">
      <h3>${d.nome}</h3>
      <p class="loc">${d.local}</p>
      <span class="price">${fmt(d.preco)}</span>
    </div>
  </div>`;
}
 
 
function pageHome(){
  const opts = ['Todos', ...DESTINOS.map(d=>d.nome)].map(n=>`<option>${n}</option>`).join('');
  return `<section class="hero"><div class="container hero-grid">
    <div>
      <h1>Explore o mundo com a TravelPlus</h1>
      <p>Os melhores destinos e pacotes exclusivos te esperam.</p>
      <form class="search-row" data-form="busca">
        <select name="destino">${opts}</select>
        <button class="btn btn-primary" type="submit">Buscar</button>
      </form>
    </div>
    ${realImg(HERO_IMG, 'Explore o mundo com a TravelPlus', 'hero-visual')}
  </div></section>`;
}
 
function pageSobre(){
  return `<section class="container section">
    <h1>Sobre a TravelPlus</h1>
    <p class="sub">Somos uma agência apaixonada por explorar o mundo e ajudar pessoas a viverem experiências inesquecíveis.</p>
    <div class="value-grid">
      <div class="value-card"><h3>Nossa missão</h3><p>Facilitar o acesso ao mundo, criando experiências únicas.</p></div>
      <div class="value-card"><h3>Nossa visão</h3><p>Ser referência em viagens e turismo no Brasil.</p></div>
      <div class="value-card"><h3>Nossos valores</h3><p>Transparência, respeito e paixão por viagens.</p></div>
    </div>
  </section>`;
}
 
function pageContato(){
  return `<section class="container section">
    <h1>Fale com a gente</h1>
    <p class="sub">Preencha o formulário e entraremos em contato.</p>
    <div class="panel" style="margin-top:22px;">
      <form data-form="contato">
        <div class="form-row"><label>Nome</label><input name="nome" placeholder="Seu nome" required></div>
        <div class="form-row"><label>E-mail</label><input type="email" name="email" placeholder="seu@email.com" required></div>
        <div class="form-row"><label>Mensagem</label><textarea name="mensagem" placeholder="Digite sua mensagem..." required></textarea></div>
        <button class="btn btn-primary" type="submit">Enviar mensagem</button>
      </form>
      <div class="contact-info">
        <span>(31) 96765-4321</span>
        <span>contato@travelplus.com</span>
      </div>
    </div>
  </section>`;
}
 
function stars(n){
  return '★★★★★'.slice(0,n) + '☆☆☆☆☆'.slice(0, 5-n);
}
 
function pageAvaliacoes(){
  const opts = DESTINOS.map(d=>`<option value="${d.id}">${d.nome}</option>`).join('');
  const lista = state.avaliacoes.map(a=>{
    const d = findDest(a.destId);
    return `<div class="review-card">
      <div class="review-head">
        <span class="review-avatar">${a.nome[0]}</span>
        <div><strong>${a.nome}</strong><span class="review-dest">${d ? d.nome : ''}</span></div>
        <span class="review-stars">${stars(a.nota)}</span>
      </div>
      <p class="review-text">${a.texto}</p>
    </div>`;
  }).join('');
  return `<section class="container section">
    <h1>Avaliações de quem já viajou</h1>
    <p class="sub">Experiências reais de clientes que reservaram com a TravelPlus.</p>
    <div class="review-grid">
      <div>${lista}</div>
      <div class="panel" style="max-width:none;">
        <h3 style="margin-bottom:14px;">Deixe sua avaliação</h3>
        <form data-form="avaliacao">
          <div class="form-row"><label>Nome</label><input name="nome" placeholder="Seu nome" required></div>
          <div class="form-row"><label>Destino</label><select name="destino">${opts}</select></div>
          <div class="form-row"><label>Nota</label>
            <select name="nota">
              <option value="5">5 - Excelente</option>
              <option value="4">4 - Muito bom</option>
              <option value="3">3 - Bom</option>
              <option value="2">2 - Regular</option>
              <option value="1">1 - Ruim</option>
            </select>
          </div>
          <div class="form-row"><label>Comentário</label><textarea name="texto" placeholder="Conte como foi sua experiência..." required></textarea></div>
          <button class="btn btn-primary btn-block" type="submit">Publicar avaliação</button>
        </form>
      </div>
    </div>
  </section>`;
}
 
function pageDestinos(){
  const nomes = ['Todos', ...DESTINOS.map(d=>d.nome)];
  const list = state.filtro==='Todos' ? DESTINOS : DESTINOS.filter(d=>d.nome===state.filtro);
  return `<section class="container section">
    <h1>Nossos destinos</h1>
    <p class="sub">Escolha o próximo destino da sua viagem.</p>
    <form class="search-row" data-form="filtro" style="margin-top:18px;">
      <select name="destino">${nomes.map(n=>`<option ${state.filtro===n?'selected':''}>${n}</option>`).join('')}</select>
      <button class="btn btn-primary" type="submit">Filtrar</button>
    </form>
    <div class="dest-grid">${list.map(destCard).join('') || '<p class="empty-note">Nenhum destino encontrado.</p>'}</div>
  </section>`;
}
 
function pageDetalhe(){
  const d = findDest(state.destId) || DESTINOS[0];
  return `<section class="container detail-top">
    ${realImg(d.img, d.nome, 'detail-img')}
    <div class="detail-info">
      <h1>${d.nome}</h1>
      <p class="loc">${d.local} · ★ ${d.rating}</p>
      <p class="desc">${d.desc}</p>
      <ul class="include-list">${d.inclui.map(i=>`<li>✓ ${i}</li>`).join('')}</ul>
      <p class="price-lg">${fmt(d.preco)}</p>
      <button class="btn btn-primary" data-nav="reserva" data-id="${d.id}">Selecionar pacote</button>
    </div>
  </section>`;
}
 
function pageReserva(){
  const d = findDest(state.destId) || DESTINOS[0];
  return `<section class="container section">
    <h1>Finalizar reserva</h1>
    <p class="sub">Confira o resumo e informe seus dados.</p>
    <div class="summary-card" style="margin-top:22px;">
      <h3 style="margin-bottom:8px;">${d.nome}</h3>
      <div class="row"><span>Local</span><span>${d.local}</span></div>
      <div class="row"><span>Duração</span><span>5 dias / 4 noites</span></div>
      <div class="total"><span>Total</span><span>${fmt(d.preco)}</span></div>
    </div>
    <div class="panel">
      <form data-form="reserva">
        <div class="form-row"><label>Nome completo</label><input name="nome" placeholder="Seu nome" required></div>
        <div class="form-row"><label>E-mail</label><input type="email" name="email" placeholder="seu@email.com" required></div>
        <button class="btn btn-primary btn-block" type="submit">Confirmar reserva</button>
      </form>
    </div>
  </section>`;
}
 
function pageDashboard(){
  const rows = state.bookings.map(b=>{
    const d = findDest(b.destId);
    return `<div class="trip-row">${realImg(d.img, d.nome)}<div class="info"><h4>${d.nome}</h4><span>${d.local}</span></div></div>`;
  }).join('') || `<p class="empty-note">Você ainda não tem reservas.</p>`;
  return `<section class="container section">
    <div class="welcome-card"><h2>Bem-vindo(a), ${state.userName}!</h2><p>Aqui estão suas viagens com a TravelPlus.</p></div>
    <h1 style="font-size:1.15rem;margin-bottom:12px;">Minhas reservas</h1>
    ${rows}
  </section>`;
}
 
const PAGES = {
  home: ()=> header() + pageHome() + footer(),
  sobre: ()=> header() + pageSobre() + footer(),
  contato: ()=> header() + pageContato() + footer(),
  destinos: ()=> header() + pageDestinos() + footer(),
  avaliacoes: ()=> header() + pageAvaliacoes() + footer(),
  detalhe: ()=> header() + pageDetalhe() + footer(),
  reserva: ()=> header() + pageReserva() + footer(),
  dashboard: ()=> header() + pageDashboard() + footer()
};
function render(){
  document.getElementById('app').innerHTML = (PAGES[state.route] || PAGES.home)();
}
 
 
document.addEventListener('click', (e)=>{
  const el = e.target.closest('[data-nav]');
  if(!el) return;
  e.preventDefault();
  const route = el.dataset.nav;
  if(route === 'detalhe' || route === 'reserva'){
    navigate(route, {destId: el.dataset.id || state.destId});
  } else {
    navigate(route);
  }
});
 
document.addEventListener('submit', (e)=>{
  const form = e.target.closest('[data-form]');
  if(!form) return;
  e.preventDefault();
  const type = form.dataset.form;
  const data = Object.fromEntries(new FormData(form).entries());
 
  if(type==='busca' || type==='filtro'){
    navigate('destinos', {filtro: data.destino || 'Todos'});
  }
  if(type==='contato'){
    toast('Mensagem enviada! Responderemos em até 24h.');
    form.reset();
  }
  if(type==='avaliacao'){
    state.avaliacoes.unshift({nome:data.nome, destId:data.destino, nota:Number(data.nota), texto:data.texto});
    render();
    toast('Avaliação publicada. Obrigado pelo feedback!');
  }
  if(type==='reserva'){
    state.bookings.push({destId: state.destId});
    state.userName = data.nome.split(' ')[0];
    navigate('dashboard');
    toast('Reserva confirmada!');
  }
});
 
render();
</script>
</body>
</html>
